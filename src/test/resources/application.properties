# Tests run against in-memory H2, never the real Postgres database.
# This file shadows the main application.properties on the test classpath, so
# the whole suite runs with nothing installed - which is also what lets CI run it.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.error.include-message=always
server.error.include-binding-errors=always

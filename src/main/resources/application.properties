spring.application.name=JS

# Credentials come from environment variables so nothing secret is committed.
# The defaults are only there to make a local run easy - override DB_PASSWORD at least.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update

# show the real error message/details in HTTP error responses (dev only)
server.error.include-message=always
server.error.include-binding-errors=always
